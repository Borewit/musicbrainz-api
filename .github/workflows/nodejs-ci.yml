name: Node.js CI

on:
  push:
  pull_request:

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.x

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Lint Typescript
        run: yarn run lint:ts

      - name: Lint Markdown
        run: yarn run lint:md

      - name: Build with sourcemaps
        run: yarn run build:dev

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: |
            lib/**/*.js
            lib/**/*.js.map
            lib/**/*.d.ts
            test/**/*.js
            test/**/*.js.map
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      id-token: write

    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build
          path: .

      - name: Test with coverage on Node.js ${{ matrix.node-version }}
        env:
          NODE_ENV: ci
          MBUSER: ${{ secrets.MBUSER }}
          MBPWD: ${{ secrets.MBPWD }}
          TEST_TIMEOUT_SEC: ${{ vars.TEST_TIMEOUT_SEC }}
          DEBUG: ${{ vars.DEBUG }}
        run: yarn run test-coverage

      - name: Upload Node.js ${{ matrix.node-version }} coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          flags: node-${{ matrix.node-version }}
          name: node-${{ matrix.node-version }}
          disable_search: true
          fail_ci_if_error: true
          use_oidc: true
